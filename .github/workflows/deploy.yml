name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Initialize Terraform
        working-directory: infra
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=florida-freediving/terraform.tfstate" -backend-config="region=us-east-1" -backend-config="use_lockfile=true"
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/florida-freediving:$IMAGE_TAG" .
          docker push "$REGISTRY/florida-freediving:$IMAGE_TAG"
      - name: Plan infrastructure
        working-directory: infra
        env:
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_officer_password_hash: ${{ secrets.OFFICER_PASSWORD_HASH }}
        run: terraform plan -out=tfplan
      - name: Apply infrastructure
        working-directory: infra
        run: terraform apply -auto-approve tfplan
      - name: Verify service health
        working-directory: infra
        run: curl --fail --retry 10 --retry-delay 6 "$(terraform output -raw express_endpoint)/health"
