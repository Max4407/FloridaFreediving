services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: florida_freediving
      POSTGRES_USER: florida_freediving
      POSTGRES_PASSWORD: local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U florida_freediving"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

